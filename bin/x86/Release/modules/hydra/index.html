<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hydra - RubiKit</title>
  <link rel="stylesheet" href="../shared/rubikit-theme.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: var(--rk-space-md) var(--rk-space-xl);
      background: var(--rk-bg-secondary);
      border-bottom: 1px solid var(--rk-border);
      display: flex;
      align-items: center;
      gap: var(--rk-space-md);
    }

    .back-link {
      color: var(--rk-text-muted);
      text-decoration: none;
      font-size: 1.25rem;
      transition: color var(--rk-transition);
    }
    .back-link:hover { color: var(--rk-accent); }

    .module-title {
      display: flex;
      align-items: center;
      gap: var(--rk-space-sm);
    }

    .module-title h1 {
      font-size: 1.25rem;
      font-weight: 600;
      margin: 0;
    }

    .module-title .icon {
      font-size: 1.5rem;
    }

    .header-controls {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: var(--rk-space-md);
    }

    .status {
      display: flex;
      align-items: center;
      gap: var(--rk-space-sm);
      font-size: 0.8rem;
      color: var(--rk-text-secondary);
    }

    main {
      flex: 1;
      padding: var(--rk-space-xl);
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: var(--rk-space-lg);
    }

    @media (max-width: 900px) {
      .grid-layout { grid-template-columns: 1fr; }
    }

    .sidebar { display: flex; flex-direction: column; gap: var(--rk-space-md); }

    .panel {
      background: var(--rk-bg-card);
      border: 1px solid var(--rk-border);
      border-radius: var(--rk-radius-lg);
      padding: var(--rk-space-md);
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--rk-accent);
      margin: 0 0 var(--rk-space-md) 0;
      padding-bottom: var(--rk-space-sm);
      border-bottom: 1px solid var(--rk-border);
    }

    /* Character List */
    .char-list { display: flex; flex-direction: column; gap: var(--rk-space-sm); }

    .char-item {
      display: flex;
      align-items: center;
      gap: var(--rk-space-sm);
      padding: var(--rk-space-sm);
      background: var(--rk-bg-interactive);
      border-radius: var(--rk-radius);
      cursor: pointer;
      transition: all var(--rk-transition);
    }

    .char-item:hover {
      background: var(--rk-accent-glow);
      border-color: var(--rk-accent);
    }

    .char-item.active {
      border-left: 3px solid var(--rk-accent);
    }

    .char-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--rk-accent) 0%, var(--rk-accent-secondary) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
    }

    .char-info { flex: 1; min-width: 0; }
    .char-name { font-weight: 600; font-size: 0.9rem; }
    .char-meta { font-size: 0.75rem; color: var(--rk-text-muted); }

    .char-status {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--rk-success);
      box-shadow: 0 0 6px var(--rk-success);
    }

    .char-status.offline { background: var(--rk-text-muted); box-shadow: none; }

    /* Team Overview */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: var(--rk-space-md);
    }

    .team-card {
      background: var(--rk-bg-card);
      border: 1px solid var(--rk-border);
      border-radius: var(--rk-radius-lg);
      padding: var(--rk-space-md);
    }

    .team-card-header {
      display: flex;
      align-items: center;
      gap: var(--rk-space-sm);
      margin-bottom: var(--rk-space-md);
    }

    .team-card-header h3 {
      font-size: 1rem;
      margin: 0;
      flex: 1;
    }

    .role-badge {
      font-size: 0.65rem;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border-radius: var(--rk-radius-xl);
      background: var(--rk-bg-interactive);
      color: var(--rk-accent);
    }

    /* Stats bars */
    .stat-bars { display: flex; flex-direction: column; gap: var(--rk-space-sm); }

    .stat-bar-row {
      display: flex;
      align-items: center;
      gap: var(--rk-space-sm);
    }

    .stat-bar-label {
      font-size: 0.7rem;
      color: var(--rk-text-muted);
      width: 50px;
    }

    .stat-bar {
      flex: 1;
      height: 8px;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      overflow: hidden;
    }

    .stat-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.4s ease;
    }

    .stat-bar-fill.hp { background: linear-gradient(90deg, var(--rk-hp-secondary), var(--rk-hp-primary)); }
    .stat-bar-fill.nano { background: linear-gradient(90deg, var(--rk-nano-secondary), var(--rk-nano-primary)); }

    .stat-bar-value {
      font-size: 0.7rem;
      font-family: var(--rk-font-num);
      color: var(--rk-text-secondary);
      width: 60px;
      text-align: right;
    }

    /* Buffs */
    .buff-list {
      display: flex;
      flex-wrap: wrap;
      gap: var(--rk-space-xs);
      margin-top: var(--rk-space-sm);
    }

    .buff-icon {
      width: 28px;
      height: 28px;
      border-radius: var(--rk-radius-sm);
      background: var(--rk-bg-interactive);
      border: 1px solid var(--rk-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      cursor: help;
    }

    .buff-icon.expiring {
      border-color: var(--rk-warning);
      animation: pulse-warning 1s infinite;
    }

    @keyframes pulse-warning {
      50% { opacity: 0.6; }
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: var(--rk-space-xl);
      color: var(--rk-text-muted);
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: var(--rk-space-md);
      opacity: 0.5;
    }

    /* Actions */
    .action-bar {
      display: flex;
      gap: var(--rk-space-sm);
      margin-top: var(--rk-space-md);
      padding-top: var(--rk-space-md);
      border-top: 1px solid var(--rk-border);
    }

    .action-btn {
      flex: 1;
      padding: var(--rk-space-sm);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="rk-bg-grid"></div>
  <div class="rk-bg-glow"></div>

  <header>
    <a href="../desktop/index.html" class="back-link" title="Back to Desktop">&larr;</a>
    <div class="module-title">
      <span class="icon">🐉</span>
      <h1>Hydra</h1>
    </div>
    <span class="rk-badge">Multi-Character</span>

    <div class="header-controls">
      <div class="status">
        <div id="status-dot" class="rk-status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="grid-layout">
      <aside class="sidebar">
        <div class="panel">
          <h2 class="panel-title">Characters</h2>
          <div id="char-list" class="char-list">
            <!-- Characters populated by JS -->
          </div>
          <div class="action-bar">
            <button class="rk-btn action-btn" id="add-char-btn">+ Add</button>
            <button class="rk-btn action-btn" id="sync-btn">Sync All</button>
          </div>
        </div>

        <div class="panel">
          <h2 class="panel-title">Quick Actions</h2>
          <div style="display: flex; flex-direction: column; gap: var(--rk-space-sm);">
            <button class="rk-btn" id="buff-check-btn">Check Buffs</button>
            <button class="rk-btn" id="team-heal-btn">Team Heal Status</button>
            <button class="rk-btn" id="sync-buffs-btn">Sync Buff Timers</button>
          </div>
        </div>
      </aside>

      <section class="content">
        <div id="team-grid" class="team-grid">
          <!-- Team cards populated by JS -->
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <p>No characters tracked yet.<br>Add characters to start monitoring your team.</p>
        </div>
      </section>
    </div>
  </main>

  <script src="../shared/rubikit-common.js"></script>
  <script>
    // Demo data - would come from API in production
    const characters = [
      { name: 'MainChar', profession: 'Enforcer', level: 220, online: true, hp: 45000, maxHp: 52000, nano: 8000, maxNano: 12000, role: 'Tank', buffs: ['ES', 'IC', 'AAO'] },
      { name: 'HealBot', profession: 'Doctor', level: 220, online: true, hp: 28000, maxHp: 28000, nano: 35000, maxNano: 42000, role: 'Healer', buffs: ['CH', 'UBT'] },
      { name: 'DPSAlt', profession: 'Soldier', level: 215, online: false, hp: 0, maxHp: 38000, nano: 0, maxNano: 8000, role: 'DPS', buffs: [] }
    ];

    function renderCharList() {
      const list = document.getElementById('char-list');
      list.innerHTML = characters.map((c, i) => `
        <div class="char-item ${i === 0 ? 'active' : ''}" data-index="${i}">
          <div class="char-avatar">${c.name[0]}</div>
          <div class="char-info">
            <div class="char-name">${c.name}</div>
            <div class="char-meta">${c.profession} ${c.level}</div>
          </div>
          <div class="char-status ${c.online ? '' : 'offline'}"></div>
        </div>
      `).join('');
    }

    function renderTeamGrid() {
      const grid = document.getElementById('team-grid');
      const online = characters.filter(c => c.online);

      if (online.length === 0) {
        document.getElementById('empty-state').style.display = 'block';
        grid.style.display = 'none';
        return;
      }

      document.getElementById('empty-state').style.display = 'none';
      grid.style.display = 'grid';

      grid.innerHTML = online.map(c => `
        <div class="team-card">
          <div class="team-card-header">
            <div class="char-avatar">${c.name[0]}</div>
            <h3>${c.name}</h3>
            <span class="role-badge">${c.role}</span>
          </div>
          <div class="stat-bars">
            <div class="stat-bar-row">
              <span class="stat-bar-label">HP</span>
              <div class="stat-bar">
                <div class="stat-bar-fill hp" style="width: ${(c.hp / c.maxHp) * 100}%"></div>
              </div>
              <span class="stat-bar-value">${(c.hp / 1000).toFixed(1)}k / ${(c.maxHp / 1000).toFixed(1)}k</span>
            </div>
            <div class="stat-bar-row">
              <span class="stat-bar-label">Nano</span>
              <div class="stat-bar">
                <div class="stat-bar-fill nano" style="width: ${(c.nano / c.maxNano) * 100}%"></div>
              </div>
              <span class="stat-bar-value">${(c.nano / 1000).toFixed(1)}k / ${(c.maxNano / 1000).toFixed(1)}k</span>
            </div>
          </div>
          <div class="buff-list">
            ${c.buffs.map(b => `<div class="buff-icon" title="${b}">${b[0]}</div>`).join('')}
          </div>
        </div>
      `).join('');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      RubiKit.init();
      renderCharList();
      renderTeamGrid();

      // Fetch Hydra provider status
      RubiKit.API.getProviderStatus('hydra').then(data => {
        console.log('Hydra status:', data);
      }).catch(() => {});
    });
  </script>
</body>
</html>
