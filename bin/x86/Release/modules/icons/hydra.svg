<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .eye { fill: #00d9ff; }
      .pupil { fill: #0a0e14; }
      .glow { fill: none; stroke: #00d9ff; stroke-width: 2; opacity: 0.6; }

      @keyframes blink1 {
        0%, 100% { transform: scaleY(1); }
        48%, 52% { transform: scaleY(0.1); }
      }

      @keyframes blink2 {
        0%, 100% { transform: scaleY(1); }
        23%, 27% { transform: scaleY(0.1); }
      }

      @keyframes blink3 {
        0%, 100% { transform: scaleY(1); }
        65%, 69% { transform: scaleY(0.1); }
      }

      @keyframes pulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.8; }
      }

      .eye1 { animation: blink1 4s infinite; transform-origin: center; }
      .eye2 { animation: blink2 4.5s infinite; transform-origin: center; }
      .eye3 { animation: blink3 5s infinite; transform-origin: center; }
      .glow { animation: pulse 3s infinite; }
    </style>
  </defs>

  <!-- Glow effect -->
  <circle class="glow" cx="32" cy="32" r="28"/>

  <!-- Center eye (largest) -->
  <g class="eye1">
    <ellipse class="eye" cx="32" cy="32" rx="10" ry="12"/>
    <ellipse class="pupil" cx="32" cy="32" rx="4" ry="6"/>
  </g>

  <!-- Left eye -->
  <g class="eye2">
    <ellipse class="eye" cx="16" cy="28" rx="7" ry="9"/>
    <ellipse class="pupil" cx="16" cy="28" rx="3" ry="4"/>
  </g>

  <!-- Right eye -->
  <g class="eye3">
    <ellipse class="eye" cx="48" cy="28" rx="7" ry="9"/>
    <ellipse class="pupil" cx="48" cy="28" rx="3" ry="4"/>
  </g>

  <!-- Bottom left eye -->
  <g class="eye1">
    <ellipse class="eye" cx="20" cy="45" rx="6" ry="7"/>
    <ellipse class="pupil" cx="20" cy="45" rx="2.5" ry="3"/>
  </g>

  <!-- Bottom right eye -->
  <g class="eye2">
    <ellipse class="eye" cx="44" cy="45" rx="6" ry="7"/>
    <ellipse class="pupil" cx="44" cy="45" rx="2.5" ry="3"/>
  </g>
</svg>
