<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LLM Settings - RubiKit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="llm-container">
    <!-- Header -->
    <header class="llm-header">
      <div class="header-title">
        <span class="icon">&#129504;</span>
        <h1>LLM Configuration</h1>
      </div>
      <div class="connection-status">
        <span class="dot" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
      </div>
    </header>

    <!-- Main Content -->
    <main class="llm-main">
      <!-- Provider Settings -->
      <section class="card provider-section">
        <h2>Provider Settings</h2>

        <div class="form-group">
          <label for="provider">Provider</label>
          <select id="provider">
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic</option>
            <option value="ollama">Ollama (Local)</option>
            <option value="openrouter">OpenRouter</option>
            <option value="lmstudio">LM Studio</option>
            <option value="custom">Custom Endpoint</option>
          </select>
        </div>

        <div class="form-group">
          <label for="endpoint">API Endpoint</label>
          <input type="text" id="endpoint" placeholder="https://api.openai.com/v1">
          <small id="endpointHint">Auto-filled based on provider</small>
        </div>

        <div class="form-group">
          <label for="apiKey">API Key</label>
          <div class="input-with-button">
            <input type="password" id="apiKey" placeholder="sk-...">
            <button type="button" id="toggleKey" class="btn-icon" title="Show/Hide">&#128065;</button>
          </div>
        </div>

        <div class="form-row">
          <button type="button" id="testConnection" class="btn btn-secondary">Test Connection</button>
          <button type="button" id="detectModels" class="btn btn-primary">Detect Models</button>
        </div>
      </section>

      <!-- Model Selection -->
      <section class="card model-section">
        <h2>Model Selection</h2>

        <div class="form-group">
          <label for="model">Model</label>
          <div class="input-with-button">
            <select id="model">
              <option value="">-- Click "Detect Models" to load --</option>
            </select>
            <button type="button" id="refreshModels" class="btn-icon" title="Refresh">&#128260;</button>
          </div>
        </div>

        <div id="modelInfo" class="model-info hidden">
          <div class="info-row"><span>Context Length:</span><span id="contextLength">-</span></div>
          <div class="info-row"><span>Type:</span><span id="modelType">-</span></div>
        </div>

        <div id="detectedModels" class="detected-models hidden">
          <h3>Detected Models (<span id="modelCount">0</span>)</h3>
          <div id="modelList" class="model-list"></div>
        </div>
      </section>

      <!-- Parameters -->
      <section class="card params-section">
        <h2>Generation Parameters</h2>

        <div class="form-group">
          <label for="temperature">Temperature: <span id="tempValue">0.7</span></label>
          <input type="range" id="temperature" min="0" max="2" step="0.1" value="0.7">
        </div>

        <div class="form-group">
          <label for="maxTokens">Max Tokens</label>
          <input type="number" id="maxTokens" value="4096" min="1" max="128000">
        </div>

        <div class="form-group">
          <label for="topP">Top P: <span id="topPValue">1.0</span></label>
          <input type="range" id="topP" min="0" max="1" step="0.05" value="1.0">
        </div>

        <div class="form-group">
          <label for="systemPrompt">System Prompt</label>
          <textarea id="systemPrompt" rows="4" placeholder="You are a helpful assistant..."></textarea>
        </div>
      </section>

      <!-- Tools Section -->
      <section class="card tools-section">
        <h2>LLM Tools</h2>

        <div class="tools-header">
          <span id="enabledToolsCount">0</span> tools enabled
          <button type="button" id="toggleAllTools" class="btn btn-small">Toggle All</button>
        </div>

        <div id="toolsList" class="tools-list">
          <!-- Tools will be populated here -->
        </div>

        <div class="form-group">
          <button type="button" id="addCustomTool" class="btn btn-secondary">+ Add Custom Tool</button>
        </div>
      </section>

      <!-- Chat Test -->
      <section class="card chat-section">
        <h2>Quick Test</h2>

        <div id="chatMessages" class="chat-messages">
          <div class="message system">Ready to test LLM connection...</div>
        </div>

        <div class="chat-input">
          <input type="text" id="chatInput" placeholder="Type a message to test...">
          <button type="button" id="sendMessage" class="btn btn-primary">Send</button>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="llm-footer">
      <button type="button" id="saveSettings" class="btn btn-primary">Save Settings</button>
      <button type="button" id="resetSettings" class="btn btn-secondary">Reset to Defaults</button>
      <button type="button" id="exportSettings" class="btn btn-secondary">Export</button>
      <button type="button" id="importSettings" class="btn btn-secondary">Import</button>
    </footer>
  </div>

  <!-- Custom Tool Modal -->
  <div id="toolModal" class="modal hidden">
    <div class="modal-content">
      <h3>Add Custom Tool</h3>
      <div class="form-group">
        <label for="toolName">Tool Name</label>
        <input type="text" id="toolName" placeholder="my_tool">
      </div>
      <div class="form-group">
        <label for="toolDescription">Description</label>
        <textarea id="toolDescription" rows="2" placeholder="What this tool does..."></textarea>
      </div>
      <div class="form-group">
        <label for="toolSchema">Parameters (JSON Schema)</label>
        <textarea id="toolSchema" rows="6" placeholder='{"type": "object", "properties": {}}'></textarea>
      </div>
      <div class="modal-buttons">
        <button type="button" id="cancelTool" class="btn btn-secondary">Cancel</button>
        <button type="button" id="saveTool" class="btn btn-primary">Add Tool</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
