<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Builder - RubiKit</title>
  <link rel="stylesheet" href="../shared/rubikit-theme.css">
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: var(--rk-space-md) var(--rk-space-xl);
      background: var(--rk-bg-secondary);
      border-bottom: 1px solid var(--rk-border);
      display: flex;
      align-items: center;
      gap: var(--rk-space-md);
    }

    .back-link { color: var(--rk-text-muted); text-decoration: none; font-size: 1.25rem; }
    .back-link:hover { color: var(--rk-accent); }

    .module-title { display: flex; align-items: center; gap: var(--rk-space-sm); }
    .module-title h1 { font-size: 1.25rem; font-weight: 600; margin: 0; }

    .header-controls { margin-left: auto; display: flex; align-items: center; gap: var(--rk-space-md); }
    .status { display: flex; align-items: center; gap: var(--rk-space-sm); font-size: 0.8rem; color: var(--rk-text-secondary); }

    main { flex: 1; padding: var(--rk-space-xl); max-width: 1400px; margin: 0 auto; width: 100%; }

    /* Layout */
    .trading-grid {
      display: grid;
      grid-template-columns: 280px 1fr 320px;
      gap: var(--rk-space-lg);
    }

    @media (max-width: 1100px) {
      .trading-grid { grid-template-columns: 1fr; }
    }

    .panel {
      background: var(--rk-bg-card);
      border: 1px solid var(--rk-border);
      border-radius: var(--rk-radius-lg);
      padding: var(--rk-space-md);
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--rk-accent);
      margin: 0 0 var(--rk-space-md) 0;
      padding-bottom: var(--rk-space-sm);
      border-bottom: 1px solid var(--rk-border);
    }

    /* Categories */
    .category-list { display: flex; flex-direction: column; gap: var(--rk-space-xs); }

    .category-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: var(--rk-space-sm) var(--rk-space-md);
      background: var(--rk-bg-interactive);
      border-radius: var(--rk-radius);
      cursor: pointer;
      transition: all var(--rk-transition);
    }

    .category-item:hover { background: var(--rk-accent-glow); }
    .category-item.active { border-left: 3px solid var(--rk-accent); background: var(--rk-accent-glow); }

    .category-name { font-size: 0.85rem; }
    .category-count { font-size: 0.75rem; color: var(--rk-text-muted); font-family: var(--rk-font-num); }

    /* Item Grid */
    .items-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--rk-space-md);
    }

    .search-input {
      flex: 1;
      max-width: 300px;
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: var(--rk-space-md);
    }

    .item-card {
      background: var(--rk-bg-interactive);
      border: 1px solid var(--rk-border);
      border-radius: var(--rk-radius);
      padding: var(--rk-space-md);
      cursor: pointer;
      transition: all var(--rk-transition);
    }

    .item-card:hover {
      border-color: var(--rk-accent);
      transform: translateY(-2px);
    }

    .item-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--rk-radius);
      background: var(--rk-bg-card);
      border: 1px solid var(--rk-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: var(--rk-space-sm);
    }

    .item-name {
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: var(--rk-space-xs);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-ql {
      font-size: 0.7rem;
      color: var(--rk-text-muted);
      margin-bottom: var(--rk-space-sm);
    }

    .item-price {
      font-family: var(--rk-font-num);
      font-weight: 600;
      color: var(--rk-warning);
    }

    .item-trend {
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .item-trend.up { color: var(--rk-success); }
    .item-trend.down { color: var(--rk-error); }

    /* Price History */
    .price-card {
      display: flex;
      flex-direction: column;
      gap: var(--rk-space-md);
    }

    .selected-item {
      display: flex;
      gap: var(--rk-space-md);
      padding-bottom: var(--rk-space-md);
      border-bottom: 1px solid var(--rk-border);
    }

    .selected-icon {
      width: 64px;
      height: 64px;
      border-radius: var(--rk-radius);
      background: var(--rk-bg-interactive);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    .selected-info { flex: 1; }
    .selected-name { font-size: 1rem; font-weight: 600; margin-bottom: var(--rk-space-xs); }
    .selected-meta { font-size: 0.8rem; color: var(--rk-text-muted); }

    .price-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--rk-space-sm);
    }

    .price-stat {
      padding: var(--rk-space-sm);
      background: var(--rk-bg-interactive);
      border-radius: var(--rk-radius);
    }

    .price-stat-label { font-size: 0.7rem; color: var(--rk-text-muted); }
    .price-stat-value { font-family: var(--rk-font-num); font-weight: 600; }

    .mini-chart {
      height: 100px;
      background: rgba(0,0,0,0.2);
      border-radius: var(--rk-radius);
      display: flex;
      align-items: flex-end;
      padding: var(--rk-space-sm);
      gap: 2px;
    }

    .chart-bar {
      flex: 1;
      background: var(--rk-accent);
      border-radius: 2px 2px 0 0;
      min-height: 4px;
      transition: height 0.3s ease;
    }

    /* Actions */
    .action-buttons {
      display: flex;
      gap: var(--rk-space-sm);
      margin-top: var(--rk-space-md);
    }

    .action-buttons .rk-btn { flex: 1; }
  </style>
</head>
<body>
  <div class="rk-bg-grid"></div>
  <div class="rk-bg-glow"></div>

  <header>
    <a href="../desktop/index.html" class="back-link">&larr;</a>
    <div class="module-title">
      <span class="icon">🏪</span>
      <h1>Shop Builder</h1>
    </div>
    <span class="rk-badge">Trading</span>

    <div class="header-controls">
      <div class="status">
        <div id="status-dot" class="rk-status-dot"></div>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </header>

  <main>
    <div class="trading-grid">
      <aside class="sidebar">
        <div class="panel">
          <h2 class="panel-title">Categories</h2>
          <div class="category-list">
            <div class="category-item active">
              <span class="category-name">All Items</span>
              <span class="category-count">847</span>
            </div>
            <div class="category-item">
              <span class="category-name">Weapons</span>
              <span class="category-count">156</span>
            </div>
            <div class="category-item">
              <span class="category-name">Armor</span>
              <span class="category-count">234</span>
            </div>
            <div class="category-item">
              <span class="category-name">Implants</span>
              <span class="category-count">312</span>
            </div>
            <div class="category-item">
              <span class="category-name">Nanos</span>
              <span class="category-count">89</span>
            </div>
            <div class="category-item">
              <span class="category-name">Misc</span>
              <span class="category-count">56</span>
            </div>
          </div>
        </div>

        <div class="panel" style="margin-top: var(--rk-space-md);">
          <h2 class="panel-title">Quick Stats</h2>
          <div style="display: flex; flex-direction: column; gap: var(--rk-space-sm);">
            <div style="display: flex; justify-content: space-between;">
              <span style="color: var(--rk-text-muted); font-size: 0.85rem;">Shop Value</span>
              <span style="font-family: var(--rk-font-num); font-weight: 600;">2.4B</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span style="color: var(--rk-text-muted); font-size: 0.85rem;">Items Listed</span>
              <span style="font-family: var(--rk-font-num); font-weight: 600;">847</span>
            </div>
            <div style="display: flex; justify-content: space-between;">
              <span style="color: var(--rk-text-muted); font-size: 0.85rem;">Sales Today</span>
              <span style="font-family: var(--rk-font-num); font-weight: 600; color: var(--rk-success);">+12M</span>
            </div>
          </div>
        </div>
      </aside>

      <section class="content">
        <div class="panel">
          <div class="items-header">
            <h2 class="panel-title" style="margin: 0; border: none; padding: 0;">Market Items</h2>
            <input type="text" class="rk-input search-input" placeholder="Search items...">
          </div>
          <div class="items-grid" id="items-grid">
            <!-- Items populated by JS -->
          </div>
        </div>
      </section>

      <aside class="sidebar-right">
        <div class="panel price-card">
          <h2 class="panel-title">Price Analysis</h2>
          <div class="selected-item">
            <div class="selected-icon">⚔️</div>
            <div class="selected-info">
              <div class="selected-name">Kyr'Ozch Sword</div>
              <div class="selected-meta">QL 300 | Type 4</div>
            </div>
          </div>
          <div class="price-stats">
            <div class="price-stat">
              <div class="price-stat-label">Current</div>
              <div class="price-stat-value">45M</div>
            </div>
            <div class="price-stat">
              <div class="price-stat-label">Avg (7d)</div>
              <div class="price-stat-value">42M</div>
            </div>
            <div class="price-stat">
              <div class="price-stat-label">Low</div>
              <div class="price-stat-value">38M</div>
            </div>
            <div class="price-stat">
              <div class="price-stat-label">High</div>
              <div class="price-stat-value">52M</div>
            </div>
          </div>
          <div class="mini-chart" id="price-chart">
            <!-- Chart bars populated by JS -->
          </div>
          <div class="action-buttons">
            <button class="rk-btn">Add to Shop</button>
            <button class="rk-btn rk-btn-primary">Set Alert</button>
          </div>
        </div>
      </aside>
    </div>
  </main>

  <script src="../shared/rubikit-common.js"></script>
  <script>
    const items = [
      { name: "Kyr'Ozch Sword", ql: 300, price: "45M", trend: "up", icon: "⚔️" },
      { name: "Combined Comm", ql: 300, price: "120M", trend: "down", icon: "📡" },
      { name: "QL300 Implant", ql: 300, price: "8M", trend: "up", icon: "🔧" },
      { name: "Viral Compiler", ql: 200, price: "25M", trend: "up", icon: "💉" },
      { name: "Nova Dillon", ql: 300, price: "85M", trend: "down", icon: "🛡️" },
      { name: "Awakened Beast", ql: 1, price: "200M", trend: "up", icon: "🐉" },
    ];

    function renderItems() {
      const grid = document.getElementById('items-grid');
      grid.innerHTML = items.map(item => `
        <div class="item-card">
          <div class="item-icon">${item.icon}</div>
          <div class="item-name">${item.name}</div>
          <div class="item-ql">QL ${item.ql}</div>
          <div class="item-price">${item.price}</div>
          <div class="item-trend ${item.trend}">
            ${item.trend === 'up' ? '↑' : '↓'} ${item.trend === 'up' ? '+7%' : '-3%'}
          </div>
        </div>
      `).join('');
    }

    function renderChart() {
      const chart = document.getElementById('price-chart');
      const heights = [40, 45, 38, 52, 48, 42, 45, 50, 55, 48, 52, 45];
      chart.innerHTML = heights.map(h => `<div class="chart-bar" style="height: ${h}%"></div>`).join('');
    }

    document.addEventListener('DOMContentLoaded', () => {
      RubiKit.init();
      renderItems();
      renderChart();

      RubiKit.API.getContext('trading').then(data => {
        console.log('Trading context:', data);
      }).catch(() => {});
    });
  </script>
</body>
</html>
