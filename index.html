<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RubiKit OS</title>
  <link rel="stylesheet" href="rubikit.css">
</head>
<body>
  <div class="crt">
    <div class="scanlines"></div>
    <div class="desktop" id="desktop">
      <!-- Module icons rendered here -->
    </div>
    <div class="taskbar" id="taskbar">
      <div class="start-btn" id="start-btn">RubiKit</div>
      <div class="taskbar-tabs" id="taskbar-tabs"></div>
      <div class="taskbar-clock" id="clock"></div>
    </div>
    <div class="windows-container" id="windows"></div>
  </div>
  <script src="rubikit.js"></script>
</body>
</html>
