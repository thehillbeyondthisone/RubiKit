<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .map-bg { fill: #0a0e14; stroke: #00d9ff; stroke-width: 2; }
      .grid { stroke: #2a3441; stroke-width: 0.5; fill: none; }
      .path { fill: none; stroke: #0088aa; stroke-width: 2; stroke-dasharray: 4 2; }
      .marker { fill: #ff3366; }
      .marker-glow { fill: #ff3366; opacity: 0.3; }
      .pin { fill: #00ff88; }

      @keyframes ping {
        0% { r: 4; opacity: 0.8; }
        100% { r: 12; opacity: 0; }
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.2); }
      }

      @keyframes trace {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }

      .ping { animation: ping 2s ease-out infinite; }
      .marker { animation: pulse 2s ease-in-out infinite; transform-origin: center; }
      .path { animation: trace 4s linear infinite; }
    </style>
  </defs>

  <!-- Map background -->
  <rect class="map-bg" x="8" y="8" width="48" height="48" rx="2"/>

  <!-- Grid lines -->
  <line class="grid" x1="20" y1="8" x2="20" y2="56"/>
  <line class="grid" x1="32" y1="8" x2="32" y2="56"/>
  <line class="grid" x1="44" y1="8" x2="44" y2="56"/>
  <line class="grid" x1="8" y1="20" x2="56" y2="20"/>
  <line class="grid" x1="8" y1="32" x2="56" y2="32"/>
  <line class="grid" x1="8" y1="44" x2="56" y2="44"/>

  <!-- Path/route -->
  <path class="path" d="M 16 20 Q 24 28 32 32 T 48 44"/>

  <!-- Location pins -->
  <circle class="pin" cx="16" cy="20" r="3"/>
  <circle class="pin" cx="48" cy="44" r="3"/>

  <!-- Active marker -->
  <circle class="marker-glow ping" cx="32" cy="32" r="4"/>
  <circle class="marker" cx="32" cy="32" r="4"/>
</svg>
