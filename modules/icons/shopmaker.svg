<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .building { fill: #00d9ff; }
      .window { fill: #0a0e14; }
      .door { fill: #1a2028; }
      .awning { fill: #0088aa; }
      .sign { fill: #ffaa00; }

      @keyframes neon {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #ffaa00); }
        50% { opacity: 0.6; filter: drop-shadow(0 0 3px #ffaa00); }
      }

      @keyframes glow {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }

      .sign { animation: neon 1.5s ease-in-out infinite; }
      .window { animation: glow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Building base -->
  <rect class="building" x="12" y="20" width="40" height="35" rx="2"/>

  <!-- Awning -->
  <rect class="awning" x="12" y="30" width="40" height="6"/>
  <polygon class="awning" points="12,30 12,36 8,38 8,32"/>
  <polygon class="awning" points="52,30 52,36 56,38 56,32"/>

  <!-- Windows -->
  <rect class="window" x="18" y="24" width="6" height="4" rx="1"/>
  <rect class="window" x="29" y="24" width="6" height="4" rx="1"/>
  <rect class="window" x="40" y="24" width="6" height="4" rx="1"/>

  <rect class="window" x="18" y="40" width="6" height="6" rx="1"/>
  <rect class="window" x="40" y="40" width="6" height="6" rx="1"/>

  <!-- Door -->
  <rect class="door" x="28" y="42" width="8" height="13" rx="1"/>
  <circle class="building" cx="34" cy="48" r="1"/>

  <!-- Sign -->
  <rect class="sign" x="20" y="10" width="24" height="6" rx="1"/>
  <text x="32" y="15" text-anchor="middle" fill="#0a0e14" font-size="4" font-weight="bold" font-family="Arial">SHOP</text>
</svg>
