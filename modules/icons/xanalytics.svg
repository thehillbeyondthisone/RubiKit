<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .bar { fill: #00d9ff; }
      .grid { stroke: #2a3441; stroke-width: 1; fill: none; }
      .axis { stroke: #6b7280; stroke-width: 2; fill: none; }

      @keyframes bar1 {
        0%, 100% { height: 20px; y: 40px; }
        50% { height: 35px; y: 25px; }
      }

      @keyframes bar2 {
        0%, 100% { height: 30px; y: 30px; }
        50% { height: 15px; y: 45px; }
      }

      @keyframes bar3 {
        0%, 100% { height: 15px; y: 45px; }
        50% { height: 40px; y: 20px; }
      }

      @keyframes bar4 {
        0%, 100% { height: 25px; y: 35px; }
        50% { height: 30px; y: 30px; }
      }

      @keyframes glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
      }

      #bar1 { animation: bar1 2s ease-in-out infinite; }
      #bar2 { animation: bar2 2.3s ease-in-out infinite; }
      #bar3 { animation: bar3 2.7s ease-in-out infinite; }
      #bar4 { animation: bar4 2.5s ease-in-out infinite; }
      .bar { animation: glow 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Grid -->
  <line class="grid" x1="10" y1="15" x2="54" y2="15"/>
  <line class="grid" x1="10" y1="30" x2="54" y2="30"/>
  <line class="grid" x1="10" y1="45" x2="54" y2="45"/>

  <!-- Axes -->
  <line class="axis" x1="10" y1="10" x2="10" y2="60"/>
  <line class="axis" x1="10" y1="60" x2="54" y2="60"/>

  <!-- Animated bars -->
  <rect id="bar1" class="bar" x="14" y="40" width="7" height="20" rx="1"/>
  <rect id="bar2" class="bar" x="24" y="30" width="7" height="30" rx="1"/>
  <rect id="bar3" class="bar" x="34" y="45" width="7" height="15" rx="1"/>
  <rect id="bar4" class="bar" x="44" y="35" width="7" height="25" rx="1"/>
</svg>
