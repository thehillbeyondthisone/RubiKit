<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotumHUD Aetherium v2</title><link rel="stylesheet" href="/app.css"></head>
<body>
<header class="topbar">
  <div class="brand">NotumHUD <span class="version">Aetherium v2</span></div>
  <div class="right">
    <select id="theme">
      <option value="theme-inferno">Inferno</option>
      <option value="theme-aetherium">Aetherium</option>
      <option value="theme-notum">Notum</option>
      <option value="theme-synthwave">Synthwave</option>
      <option value="theme-terminal">Terminal</option>
      <option value="theme-sol">Sol-Gov</option>
    </select>
    <label class="compact-toggle"><input type="checkbox" id="compact"> Compact</label>
    <div class="rate">
      <span class="muted">Rate</span>
      <div class="seg">
        <button class="segbtn" data-rate="250">250</button>
        <button class="segbtn" data-rate="500">500</button>
        <button class="segbtn" data-rate="1000">1000</button>
      </div>
    </div>
    <label>Interval <input id="interval" type="number" min="100" max="5000" step="50" value="500"> ms</label>
    <label><input type="checkbox" id="toggle" checked> Enabled</label>
    <div id="status" class="status">connecting…</div>
  </div>
</header>

<main class="wrap">
  <aside class="dock">
    <div class="dock-head">
      <div class="logo"><span class="orb"></span></div>
      <div class="dock-title">Vitals</div>
    </div>

    <div class="dock-cards">
      <div class="dock-card"><div class="k">AAO</div><div id="dock-aao" class="v numeric">–</div></div>
      <div class="dock-card"><div class="k">AAD</div><div id="dock-aad" class="v numeric">–</div></div>
      <div class="dock-card"><div class="k">Crit+</div><div id="dock-crit" class="v numeric">–</div></div>
      <div class="dock-card"><div class="k">XP%</div><div id="dock-xp" class="v numeric">–</div></div>
    </div>

    <div class="dock-pins">
      <div class="pins-title">Pins</div>
      <div id="pins" class="pins">None pinned yet. Use the groups to pin.</div>
    </div>
  </aside>

  <section class="canvas">
    <div class="grid" id="hud">
      <div id="card-hpnano" class="card hpnano" draggable="true">
        <div class="gauges-container">
          <canvas id="hp-canvas" width="160" height="160"></canvas>
          <canvas id="nano-canvas" width="110" height="110"></canvas>
        </div>
      </div>

      <div id="card-dmg" class="card wide2" draggable="true">
        <div class="title">+Damage</div>
        <div id="dmgchips" class="chips"></div>
      </div>

      <div id="card-aao" class="card card-stat" draggable="true"><div class="title">AAO</div><div id="aao" class="big numeric">–</div></div>
      <div id="card-aad" class="card card-stat" draggable="true"><div class="title">AAD</div><div id="aad" class="big numeric">–</div></div>
      <div id="card-crit" class="card card-stat" draggable="true"><div class="title">Crit+</div><div id="crit" class="big numeric">–</div></div>
      <div id="card-xp" class="card card-stat" draggable="true"><div class="title">XP%</div><div id="xpmod" class="big numeric">–</div></div>

      <div id="card-ac" class="card wide2" draggable="true">
        <div class="title">Armor Classes</div>
        <div id="acs" class="acgrid"></div>
      </div>
    </div>

    <section class="panel">
      <h2>Stats by Group</h2>
      <div class="controls">
        <input id="filter" placeholder="Search (e.g. 2HE, Comp Lit, Nano Resist, Treatment)" />
        <span class="muted">Click to pin/unpin. Empty (0/12345678/1234567890) hidden automatically.</span>
      </div>

      <div id="groups-container"></div>

      <details id="g-misc">
        <summary>Misc <span class="muted">(individually closable)</span></summary>
        <div class="controls">
          <label><input id="showHidden" type="checkbox"> Show hidden</label>
          <button id="btnResetHidden">Reset hidden</button>
        </div>
        <div class="kvlist" id="list-misc"></div>
      </details>
    </section>
  </section>
</main>

<script src="/app.js"></script></body></html>
