<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      .reticle { fill: none; stroke: #00d9ff; stroke-width: 2; }
      .crosshair { fill: none; stroke: #00d9ff; stroke-width: 1.5; }
      .ring { fill: none; stroke: #00d9ff; opacity: 0.4; }
      .dot { fill: #ff3366; }

      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @keyframes ping {
        0%, 100% { opacity: 0.8; r: 3; }
        50% { opacity: 0.3; r: 6; }
      }

      @keyframes scan {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 200; }
      }

      .outer { animation: rotate 8s linear infinite; transform-origin: center; }
      .inner { animation: rotate 6s linear infinite reverse; transform-origin: center; }
      .scanning { stroke-dasharray: 10 5; animation: scan 2s linear infinite; }
      .target { animation: ping 2s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Outer rotating ring -->
  <g class="outer">
    <circle class="reticle" cx="32" cy="32" r="26"/>
    <line class="crosshair" x1="6" y1="32" x2="14" y2="32"/>
    <line class="crosshair" x1="50" y1="32" x2="58" y2="32"/>
    <line class="crosshair" x1="32" y1="6" x2="32" y2="14"/>
    <line class="crosshair" x1="32" y1="50" x2="32" y2="58"/>
  </g>

  <!-- Inner rotating ring -->
  <g class="inner">
    <circle class="reticle scanning" cx="32" cy="32" r="18"/>
    <line class="crosshair" x1="14" y1="32" x2="20" y2="32"/>
    <line class="crosshair" x1="44" y1="32" x2="50" y2="32"/>
  </g>

  <!-- Center target -->
  <circle class="ring" cx="32" cy="32" r="10" stroke-width="1"/>
  <circle class="dot target" cx="32" cy="32" r="3"/>
</svg>
